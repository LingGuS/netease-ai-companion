<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 音乐伴侣 · 前端设计稿 1618x916</title>
<style>body{margin:0;background:#1D1919;padding:26px 20px 52px;box-sizing:border-box;min-height:100vh;}</style>
</head>
<body>
<div id="nc-demo-root" data-mode="a">
<style>
  #nc-demo-root { --nc-bg:#2B2828; --nc-rail:#232020; --nc-panel:#322F2F; --nc-card:#383535; --nc-bubble:#414141;
    --nc-red:#E04E4E; --nc-red-hi:#F06060; --nc-text:#FFFFFF; --nc-text2:#E2E2E2; --nc-mut:#A0A0A0; --nc-mut2:#837E7E;
    --nc-border:rgba(255,255,255,.08);
    font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC','Segoe UI',system-ui,sans-serif; }
  #nc-demo-root .stage { width:100%; }
  #nc-demo-root .console { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 auto 14px;
    max-width:1618px; padding:9px 14px; border-radius:12px; background:#262222; border:1px solid var(--nc-border); }
  #nc-demo-root .console-label { color:var(--nc-mut); font-size:12px; }
  #nc-demo-root .seg { display:inline-flex; border-radius:9px; overflow:hidden; border:1px solid var(--nc-border); }
  #nc-demo-root .seg-btn { appearance:none; border:none; background:transparent; color:var(--nc-mut); font-size:12px;
    font-family:inherit; padding:6px 14px; cursor:pointer; }
  #nc-demo-root .seg-btn.is-on { background:var(--nc-red); color:#fff; }
  #nc-demo-root .console-btn { appearance:none; border:1px solid var(--nc-border); background:transparent; color:var(--nc-text2);
    font-size:12px; font-family:inherit; padding:6px 12px; border-radius:9px; cursor:pointer; }
  #nc-demo-root .console-btn:hover { background:#3A3636; }
  #nc-demo-root .console-hint { color:#6E6868; font-size:11px; margin-left:auto; }
  #nc-demo-root .stage-canvas { width:100%; position:relative; }
  #nc-demo-root .frame-holder { position:relative; margin:0 auto; }
  #nc-demo-root .frame { width:1618px; height:916px; background:var(--nc-bg); border-radius:14px; overflow:hidden;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.65); display:flex; position:absolute; top:0; left:0; transform-origin:top left; }

  /* ============ 左栏：选择容器 ============ */
  #nc-demo-root .rail { width:300px; flex:none; background:var(--nc-rail); display:flex; flex-direction:column; }
  #nc-demo-root .rail-new { height:76px; flex:none; display:flex; align-items:center; padding:0 16px; border-bottom:1px solid var(--nc-border); }
  #nc-demo-root .new-btn { appearance:none; width:100%; height:42px; border:none; border-radius:11px; cursor:pointer;
    background:linear-gradient(135deg,var(--nc-red),#C43F3F); color:#fff; font-size:13.5px; font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:7px; }
  #nc-demo-root .new-btn:hover { background:linear-gradient(135deg,var(--nc-red-hi),#D24A4A); }
  #nc-demo-root .new-btn .plus { font-size:16px; line-height:1; font-weight:400; }
  #nc-demo-root .rail-list { flex:1; overflow-y:auto; padding:10px; }
  #nc-demo-root .rail-list::-webkit-scrollbar, #nc-demo-root .msgs::-webkit-scrollbar, #nc-demo-root .drawer-list::-webkit-scrollbar { width:6px; }
  #nc-demo-root .rail-list::-webkit-scrollbar-thumb, #nc-demo-root .msgs::-webkit-scrollbar-thumb, #nc-demo-root .drawer-list::-webkit-scrollbar-thumb { background:#555; border-radius:3px; }
  #nc-demo-root .h-item { position:relative; padding:9px 12px 9px 14px; border-radius:10px; cursor:pointer; margin-bottom:2px; }
  #nc-demo-root .h-item:hover { background:#2E2A2A; }
  #nc-demo-root .h-item.is-active { background:#373232; }
  #nc-demo-root .h-item.is-active::before { content:''; position:absolute; left:4px; top:12px; bottom:12px; width:3px; border-radius:2px; background:var(--nc-red); }
  #nc-demo-root .h-title { font-size:13px; color:var(--nc-text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #nc-demo-root .h-item.is-active .h-title { color:#fff; }
  #nc-demo-root .h-time { font-size:11px; color:#6E6868; margin-top:3px; }
  #nc-demo-root .rail-user { height:76px; flex:none; border-top:1px solid var(--nc-border); display:flex; align-items:center; gap:11px; padding:0 16px; position:relative; }
  #nc-demo-root .avatar { border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; flex:none; }
  #nc-demo-root .u-avatar { width:38px; height:38px; font-size:15px; background:linear-gradient(135deg,#E86A6A,#A63333); }
  #nc-demo-root .u-name { font-size:14px; color:var(--nc-text); flex:1; min-width:0; }
  #nc-demo-root .u-name .vip { display:inline-block; margin-left:7px; padding:1.5px 7px; border-radius:7px; font-size:10px;
    color:#E7B96B; background:rgba(231,185,107,.14); vertical-align:1px; }
  #nc-demo-root .icon-btn { appearance:none; border:none; background:transparent; width:30px; height:30px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--nc-mut); flex:none; }
  #nc-demo-root .icon-btn:hover { background:#3A3636; color:#fff; }
  /* 设置图标（滑杆）*/
  #nc-demo-root .ic-sliders { position:relative; width:15px; height:13px; }
  #nc-demo-root .ic-sliders::before, #nc-demo-root .ic-sliders::after { content:''; position:absolute; left:0; right:0; height:1.6px; border-radius:1px; background:currentColor; }
  #nc-demo-root .ic-sliders::before { top:3px; } #nc-demo-root .ic-sliders::after { bottom:3px; }
  #nc-demo-root .ic-sliders i { position:absolute; top:0.6px; width:5.5px; height:5.5px; border-radius:50%; background:currentColor; }
  #nc-demo-root .ic-sliders i:first-child { left:8.5px; } #nc-demo-root .ic-sliders i:last-child { top:calc(100% - 6.1px); left:1.5px; }
  /* 设置弹层 */
  #nc-demo-root .pop { position:absolute; left:12px; right:12px; bottom:84px; background:#322F2F; border:1px solid var(--nc-border);
    border-radius:14px; padding:14px; box-shadow:0 18px 44px rgba(0,0,0,.5); z-index:30; display:none; }
  #nc-demo-root .pop.open { display:block; }
  #nc-demo-root .pop-title { font-size:12px; color:var(--nc-mut); margin-bottom:9px; }
  #nc-demo-root .chips { display:flex; gap:6px; }
  #nc-demo-root .chip { appearance:none; border:1px solid var(--nc-border); background:transparent; color:var(--nc-mut);
    font-size:12px; font-family:inherit; padding:5px 12px; border-radius:9px; cursor:pointer; }
  #nc-demo-root .chip.is-on { border-color:var(--nc-red); color:#F09090; background:rgba(224,78,78,.12); }
  #nc-demo-root .pop-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; font-size:12.5px; color:var(--nc-text2); }
  #nc-demo-root .sw { appearance:none; width:34px; height:19px; border-radius:10px; background:#4A4646; position:relative; cursor:pointer; margin:0; }
  #nc-demo-root .sw:checked { background:var(--nc-red); }
  #nc-demo-root .sw::before { content:''; position:absolute; top:2.5px; left:3px; width:14px; height:14px; border-radius:50%; background:#fff; transition:.15s; }
  #nc-demo-root .sw:checked::before { left:17px; }
  #nc-demo-root .pop-logout { margin-top:13px; padding-top:11px; border-top:1px solid var(--nc-border); }
  #nc-demo-root .pop-logout button { appearance:none; border:none; background:transparent; color:#D98383; font-size:12.5px; font-family:inherit; cursor:pointer; padding:2px 0; }

  /* ============ 主区（模式 A：合并大对话 / 模式 B：歌曲 + 对话）============ */
  #nc-demo-root .body-area { flex:1; min-width:0; display:flex; }
  #nc-demo-root body[data-mode], #nc-demo-root { }
  #nc-demo-root[data-mode="a"] .song-panel { display:none; }
  #nc-demo-root[data-mode="a"] .chat-slot-b { display:none; }
  #nc-demo-root[data-mode="a"] .chat-slot-a { display:flex; flex:1; min-width:0; }
  #nc-demo-root[data-mode="b"] .chat-slot-a { display:none; }
  #nc-demo-root[data-mode="b"] .song-panel { display:flex; flex:none; width:700px; }
  #nc-demo-root[data-mode="b"] .chat-slot-b { display:flex; flex:1; min-width:0; }
  #nc-demo-root .chat-slot-a, #nc-demo-root .chat-slot-b { min-width:0; }
  #nc-demo-root[data-mode="b"] .song-panel { animation:ncFade .25s ease; }
  @keyframes ncFade { from { opacity:.35; } to { opacity:1; } }

  /* ============ 中栏：歌曲容器 ============ */
  #nc-demo-root .song-panel { flex-direction:column; background:var(--nc-bg); position:relative; overflow:hidden; }
  #nc-demo-root .song-main { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; padding:30px 40px 10px; }
  #nc-demo-root .cover-wrap { position:relative; border-radius:50%; flex:none; }
  #nc-demo-root .cover { width:266px; height:266px; border-radius:50%; position:relative; flex:none;
    animation:ncSpin 24s linear infinite; animation-play-state:paused; }
  @keyframes ncSpin { to { transform:rotate(360deg); } }
  #nc-demo-root .cover::before { content:''; position:absolute; inset:0; border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 0 7px, rgba(255,255,255,.055) 7px 8px); }
  #nc-demo-root .cover::after { content:''; position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px;
    border-radius:50%; background:rgba(18,16,16,.9); border:5px solid rgba(255,255,255,.28); box-sizing:border-box; }
  #nc-demo-root .song-title { font-size:23px; font-weight:600; color:var(--nc-text); margin:22px 0 0; }
  #nc-demo-root .song-artist { font-size:13px; color:var(--nc-mut); margin-top:7px; }
  #nc-demo-root .lyrics { flex:1; min-height:0; width:100%; max-width:520px; margin-top:20px; overflow:hidden; position:relative;
    -webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent); mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent); }
  #nc-demo-root .lyr-lines { position:absolute; left:0; right:0; top:150px; text-align:center; transition:transform .45s ease; }
  #nc-demo-root .lyr-line { height:40px; line-height:40px; font-size:13.5px; color:var(--nc-mut2); transition:color .3s, font-size .3s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #nc-demo-root .lyr-line.is-on { color:#fff; font-size:17px; font-weight:500; }

  /* 底部播放条：高度 = 左三用户栏 76px */
  #nc-demo-root .player-bar { flex:none; height:76px; background:#333030; border-top:1px solid var(--nc-border);
    display:flex; align-items:center; gap:14px; padding:0 20px; }
  #nc-demo-root .np { display:flex; align-items:center; gap:11px; flex:1; min-width:0; }
  #nc-demo-root .np-cover { width:44px; height:44px; border-radius:9px; flex:none; position:relative; box-shadow:0 6px 16px -6px rgba(0,0,0,.55); }
  #nc-demo-root .np-cover::after { content:'♪'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:17px; color:rgba(255,255,255,.55); }
  #nc-demo-root .np-meta { flex:1; min-width:0; }
  #nc-demo-root .np-name { font-size:13px; color:var(--nc-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #nc-demo-root .np-name span { font-size:11px; color:var(--nc-mut); margin-left:7px; }
  #nc-demo-root .np-progress { display:flex; align-items:center; gap:9px; margin-top:6px; }
  #nc-demo-root .pbar { width:190px; height:3.5px; border-radius:2px; background:rgba(255,255,255,.12); overflow:hidden; }
  #nc-demo-root .pbar-fill { height:100%; width:0; border-radius:2px; background:var(--nc-red); }
  #nc-demo-root .np-time { font-size:10.5px; color:#777171; white-space:nowrap; font-variant-numeric:tabular-nums; }
  #nc-demo-root .pctl { display:flex; align-items:center; gap:8px; flex:none; }
  #nc-demo-root .pctl-div { width:1px; height:26px; background:var(--nc-border); margin:0 6px; }
  #nc-demo-root .tri { width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent; }
  #nc-demo-root .tri.l { border-right:10px solid currentColor; }
  #nc-demo-root .tri.r { border-left:10px solid currentColor; }
  #nc-demo-root .ic-next, #nc-demo-root .ic-prev { display:flex; align-items:center; gap:2.5px; }
  #nc-demo-root .bar-cap { width:2.5px; height:13px; border-radius:1px; background:currentColor; }
  #nc-demo-root .play-btn { appearance:none; border:none; width:42px; height:42px; border-radius:50%; background:var(--nc-red);
    color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #nc-demo-root .play-btn:hover { background:var(--nc-red-hi); }
  #nc-demo-root .ic-play { width:0; height:0; border-left:14px solid currentColor; border-top:9px solid transparent; border-bottom:9px solid transparent; margin-left:3px; }
  #nc-demo-root .ic-pause { display:flex; gap:4px; }
  #nc-demo-root .ic-pause i { width:4.5px; height:15px; border-radius:2px; background:currentColor; }
  #nc-demo-root .ic-list { display:flex; flex-direction:column; gap:3.5px; }
  #nc-demo-root .ic-list i { height:1.8px; border-radius:1px; background:currentColor; }
  #nc-demo-root .ic-list i:nth-child(1) { width:16px; } #nc-demo-root .ic-list i:nth-child(2) { width:11px; } #nc-demo-root .ic-list i:nth-child(3) { width:16px; }

  /* 歌曲列表抽屉（向上弹出）*/
  #nc-demo-root .drawer-scrim { position:absolute; inset:0 0 76px 0; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:.25s; z-index:20; }
  #nc-demo-root .song-panel.drawer-open .drawer-scrim { opacity:1; pointer-events:auto; }
  #nc-demo-root .drawer { position:absolute; left:0; right:0; bottom:76px; height:430px; background:#322F2F;
    border-radius:18px 18px 0 0; border-top:1px solid var(--nc-border); box-shadow:0 -18px 44px rgba(0,0,0,.45);
    transform:translateY(calc(100% + 84px)); transition:transform .3s cubic-bezier(.3,.9,.3,1); z-index:21; display:flex; flex-direction:column; }
  #nc-demo-root .song-panel.drawer-open .drawer { transform:translateY(0); }
  #nc-demo-root .drawer-head { flex:none; display:flex; align-items:center; gap:8px; padding:16px 18px 10px; }
  #nc-demo-root .drawer-head b { font-size:14px; color:var(--nc-text); font-weight:500; }
  #nc-demo-root .drawer-head span { font-size:11.5px; color:var(--nc-mut); }
  #nc-demo-root .drawer-head .icon-btn { margin-left:auto; }
  #nc-demo-root .drawer-list { flex:1; overflow-y:auto; padding:2px 12px 14px; }
  #nc-demo-root .d-row { display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:11px; cursor:pointer; }
  #nc-demo-root .d-row:hover { background:#3B3838; }
  #nc-demo-root .d-cover { width:40px; height:40px; border-radius:8px; flex:none; position:relative; }
  #nc-demo-root .d-cover::after { content:'♪'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; color:rgba(255,255,255,.55); }
  #nc-demo-root .d-meta { flex:1; min-width:0; display:flex; align-items:center; gap:8px; }
  #nc-demo-root .d-name { font-size:13px; color:var(--nc-text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #nc-demo-root .d-row.is-cur .d-name { color:var(--nc-red-hi); }
  #nc-demo-root .d-artist { font-size:11.5px; color:var(--nc-mut2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:none; max-width:150px; }
  #nc-demo-root .d-dur { font-size:12px; color:#777171; font-variant-numeric:tabular-nums; flex:none; }
  #nc-demo-root .eq { display:flex; align-items:flex-end; gap:2px; height:12px; flex:none; }
  #nc-demo-root .eq i { width:2.5px; background:var(--nc-red-hi); border-radius:1px; animation:ncEq .7s ease-in-out infinite alternate; }
  #nc-demo-root .eq i:nth-child(1) { height:6px; } #nc-demo-root .eq i:nth-child(2) { height:11px; animation-delay:.18s; } #nc-demo-root .eq i:nth-child(3) { height:8px; animation-delay:.36s; }
  @keyframes ncEq { from { transform:scaleY(.4); } to { transform:scaleY(1); } }

  /* ============ 对话容器（A：带头像；B：无头像，仅消息）============ */
  #nc-demo-root .chat { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--nc-bg); }
  #nc-demo-root .chat-head { flex:none; height:48px; display:flex; align-items:center; padding:0 22px; border-bottom:1px solid var(--nc-border); }
  #nc-demo-root .chat-title { font-size:13px; color:var(--nc-mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #nc-demo-root .chat-user { margin-left:auto; font-size:11.5px; color:#777171; flex:none; }
  #nc-demo-root .msgs { flex:1; min-height:0; overflow-y:auto; padding:20px 30px 8px; display:flex; flex-direction:column; gap:16px; }
  #nc-demo-root .msg { display:flex; gap:10px; max-width:86%; }
  #nc-demo-root .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  #nc-demo-root .msg.ai { align-self:flex-start; }
  #nc-demo-root .avatar.a-avatar { width:34px; height:34px; font-size:11px; background:linear-gradient(135deg,#4A82DE,#2B4FA0); }
  #nc-demo-root .bubble { border-radius:14px; padding:11px 15px; font-size:13.5px; line-height:1.75; color:var(--nc-text2); }
  #nc-demo-root .msg.ai .bubble { background:var(--nc-bubble); border-top-left-radius:5px; }
  #nc-demo-root .msg.user .bubble { background:linear-gradient(135deg,#E45454,#C24040); color:#fff; border-top-right-radius:5px; }
  #nc-demo-root .tool-line { font-size:11.5px; color:#8A8580; padding-left:2px; }
  #nc-demo-root .pill { display:inline-flex; align-items:center; gap:6px; margin-top:9px; padding:5.5px 12px; border-radius:9px;
    border:1px solid rgba(224,78,78,.55); background:rgba(224,78,78,.12); color:#F09090; font-size:12px; cursor:pointer; }
  #nc-demo-root .pill:hover { background:rgba(224,78,78,.2); }
  #nc-demo-root .pill .mini-play { width:0; height:0; border-left:7px solid currentColor; border-top:4.5px solid transparent; border-bottom:4.5px solid transparent; }
  #nc-demo-root .typing { display:flex; gap:5px; padding:13px 16px; }
  #nc-demo-root .typing i { width:6px; height:6px; border-radius:50%; background:#8A8580; animation:ncB 1.1s infinite; }
  #nc-demo-root .typing i:nth-child(2) { animation-delay:.15s; } #nc-demo-root .typing i:nth-child(3) { animation-delay:.3s; }
  @keyframes ncB { 0%,60%,100% { transform:translateY(0); opacity:.45; } 30% { transform:translateY(-4px); opacity:1; } }
  #nc-demo-root .chat-input { flex:none; padding:14px 24px 20px; }
  #nc-demo-root .input-box { display:flex; align-items:center; gap:10px; background:var(--nc-card); border-radius:14px; padding:9px 9px 9px 17px; }
  #nc-demo-root .input-box input { flex:1; min-width:0; border:none; outline:none; background:transparent; color:var(--nc-text);
    font-size:13.5px; font-family:inherit; }
  #nc-demo-root .input-box input::placeholder { color:#6E6868; }
  #nc-demo-root .send-btn { appearance:none; border:none; width:36px; height:36px; border-radius:11px; background:var(--nc-red);
    color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; }
  #nc-demo-root .send-btn:hover { background:var(--nc-red-hi); }
  #nc-demo-root .ic-send { width:15px; height:15px; background:currentColor; clip-path:polygon(0 0,100% 50%,0 100%,26% 50%); }
  #nc-demo-root[data-mode="b"] .chat .avatar { display:none; }
  #nc-demo-root[data-mode="b"] .msgs { padding:18px 24px 6px; }
  #nc-demo-root[data-mode="b"] .msg { max-width:92%; }
  #nc-demo-root[data-mode="b"] .tool-line { padding-left:15px; }
  #nc-demo-root[data-mode="a"] [data-phase="b"] { display:none; }
  #nc-demo-root[data-mode="b"] [data-phase="a"] { display:none; }
  @media (prefers-reduced-motion: reduce) {
    #nc-demo-root * { transition:none !important; animation:none !important; }
  }
</style>

<div class="stage">
  <div class="console">
    <span class="console-label">设计稿 1618 × 916 · 界面状态</span>
    <div class="seg" role="group" aria-label="界面状态切换">
      <button type="button" class="seg-btn is-on" data-m="a" aria-pressed="true">纯对话</button>
      <button type="button" class="seg-btn" data-m="b" aria-pressed="false">推荐 / 播放中</button>
    </div>
    <button type="button" class="console-btn" id="drawerBtn">歌曲列表抽屉</button>
    <span class="console-hint">点击消息里的「正在播放」胶囊，或播放歌曲后也会进入右侧布局</span>
  </div>

  <div class="stage-canvas" id="stageCanvas">
    <div class="frame-holder" id="frameHolder">
      <div class="frame" id="frame" data-mode="a">

        <!-- ===== 左栏 · 选择容器 ===== -->
        <aside class="rail">
          <div class="rail-new">
            <button type="button" class="new-btn" id="newChatBtn"><span class="plus">＋</span> 新建对话</button>
          </div>
          <div class="rail-list" id="histList"></div>
          <div class="rail-user">
            <div class="avatar u-avatar">灵</div>
            <div class="u-name">灵_光<span class="vip">黑胶 VIP</span></div>
            <button type="button" class="icon-btn" id="setBtn" aria-label="设置"><span class="ic-sliders"><i></i><i></i></span></button>
            <div class="pop" id="setPop">
              <div class="pop-title">设置</div>
              <div class="chips" id="qualityChips">
                <button type="button" class="chip" data-q="standard">标准</button>
                <button type="button" class="chip is-on" data-q="exhigh">较高</button>
                <button type="button" class="chip" data-q="lossless">无损</button>
              </div>
              <div class="pop-row">启动时自动吸附网易云 <input type="checkbox" class="sw" checked aria-label="启动时自动吸附网易云"></div>
              <div class="pop-row">流式回复 <input type="checkbox" class="sw" checked aria-label="流式回复"></div>
              <div class="pop-logout"><button type="button" id="logoutBtn">退出登录</button></div>
            </div>
          </div>
        </aside>

        <!-- ===== 主区 ===== -->
        <section class="body-area">
          <!-- 中栏 · 歌曲容器 -->
          <section class="song-panel" id="songPanel">
            <div class="song-main">
              <div class="cover-wrap" id="coverWrap"><div class="cover" id="cover"></div></div>
              <h2 class="song-title" id="songTitle">晴天</h2>
              <div class="song-artist" id="songArtist">周杰伦 · 叶惠美</div>
              <div class="lyrics" id="lyrics"><div class="lyr-lines" id="lyrLines"></div></div>
            </div>
            <div class="player-bar">
              <div class="np">
                <div class="np-cover" id="npCover"></div>
                <div class="np-meta">
                  <div class="np-name" id="npName">晴天<span>周杰伦</span></div>
                  <div class="np-progress">
                    <div class="pbar"><div class="pbar-fill" id="pbarFill"></div></div>
                    <span class="np-time" id="npTime">0:42 / 4:29</span>
                  </div>
                </div>
              </div>
              <div class="pctl">
                <button type="button" class="icon-btn" id="prevBtn" aria-label="上一首"><span class="ic-prev"><span class="tri l"></span><span class="tri l"></span></span></button>
                <button type="button" class="play-btn" id="playBtn" aria-label="播放 / 停止"><span class="ic-pause" id="playIc"><i></i><i></i></span></button>
                <button type="button" class="icon-btn" id="nextBtn" aria-label="下一首"><span class="ic-next"><span class="tri r"></span><span class="tri r"></span></span></button>
                <span class="pctl-div"></span>
                <button type="button" class="icon-btn" id="listBtn" aria-label="歌曲列表"><span class="ic-list"><i></i><i></i><i></i></span></button>
              </div>
            </div>
            <div class="drawer-scrim" id="drawerScrim"></div>
            <aside class="drawer" id="drawer" role="dialog" aria-label="歌曲列表">
              <div class="drawer-head">
                <b>当前播放列表</b><span id="drawerCount">6 首</span>
                <button type="button" class="icon-btn" id="drawerClose" aria-label="收起列表">✕</button>
              </div>
              <div class="drawer-list" id="drawerList"></div>
            </aside>
          </section>

          <!-- 右栏 / 合并大板块：对话容器（节点在两种模式间移动） -->
          <div class="chat-slot-b" id="chatSlotB"></div>
          <div class="chat-slot-a" id="chatSlotA"></div>
        </section>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById('nc-demo-root');
  var frame = document.getElementById('frame');
  var holder = document.getElementById('frameHolder');
  var canvas = document.getElementById('stageCanvas');

  /* ---------- 缩放适配：设计稿固定 1618×916，外层等比缩放 ---------- */
  function fit() {
    var w = canvas.clientWidth || 1618;
    var s = Math.min(1, w / 1618);
    frame.style.transform = 'scale(' + s + ')';
    holder.style.width = Math.floor(1618 * s) + 'px';
    holder.style.height = Math.floor(916 * s) + 'px';
  }
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(canvas); } else { window.addEventListener('resize', fit); }
  fit();

  /* ---------- 示例数据（接入后全部来自后端卡片与歌曲库）---------- */
  var SONGS = [
    { name: '晴天', artist: '周杰伦', album: '叶惠美', dur: 269, g: ['#5B8DEF', '#2F4FA8'],
      lines: ['雨夜的木吉他前奏', '把思绪带回那年夏天', '教室窗外的云', '被夕阳染成橘色', '有人说成长是安静的', '可回忆总是很吵', '没说完的那句话', '就交给今晚的雨', '慢慢讲给它听'] },
    { name: '雨爱', artist: '杨丞琳', album: '雨爱', dur: 224, g: ['#8F7BEF', '#46379E'],
      lines: ['窗上的雨痕连成线', '路灯一盏一盏亮起', '你的名字在心底', '跟着节拍轻轻响', '有些想念不说话', '只在雨里出现', '夜色温柔的地方', '藏着没寄出的信'] },
    { name: '那时雨', artist: '徐良', album: '情歌', dur: 252, g: ['#4FC3A1', '#1E7A64'],
      lines: ['那时候的雨下得很轻', '伞下的距离刚刚好', '你数着一二三', '雨就停在半空', '后来的天晴了', '伞却一直留在门后', '偶尔雷声响起', '还是会望向窗外'] },
    { name: '雨天', artist: '孙燕姿', album: '是时候', dur: 278, g: ['#5AA7EF', '#2B5E93'],
      lines: ['把窗帘留一条缝', '让雨声进来一点', '夜读到第三十七页', '句子开始发烫', '安静是最好的伴奏', '连呼吸都放慢了', '这样的晚上', '适合把自己交给歌'] },
    { name: 'Rainy Lofi', artist: 'Lofi Cafe', album: 'Midnight Rain', dur: 185, g: ['#E0A458', '#8F5F26'],
      lines: ['沙沙的底噪', '像雨落在旧磁带上', '咖啡凉了一半', '节拍刚刚好', '不用想太多', '跟着晃就好'] },
    { name: '千本桜', artist: '和楽器バンド', album: 'ボカロ三昧', dur: 275, g: ['#EF6A8B', '#93294A'],
      lines: ['鼓点炸开的瞬间', '夜空亮成白昼', '三味线追着电吉他', '谁也不肯让谁', '把音量再拧大一点', '让心跳跟上拍子'] }
  ];

  var state = { mode: 'a', cur: 0, t: 42, playing: true };
  var HISTS = [
    { title: '老歌听腻，求点新鲜感', time: '刚刚', active: true },
    { title: '东方同人相似歌曲挖掘', time: '昨天' },
    { title: '通勤提神歌单', time: '10-28' },
    { title: '《青花瓷》相似歌曲', time: '10-25' },
    { title: '睡前纯音乐推荐', time: '10-19' }
  ];

  function $(id) { return document.getElementById(id); }
  function grad(el, s) {
    el.style.background = 'linear-gradient(135deg,' + s.g[0] + ',' + s.g[1] + ')';
  }
  function fmt(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }

  /* ---------- 历史对话列表 ---------- */
  function renderHist() {
    var box = $('histList'); box.innerHTML = '';
    HISTS.forEach(function (h, i) {
      var d = document.createElement('div');
      d.className = 'h-item' + (h.active ? ' is-active' : '');
      d.innerHTML = '<div class="h-title"></div><div class="h-time"></div>';
      d.querySelector('.h-title').textContent = h.title;
      d.querySelector('.h-time').textContent = h.time;
      d.addEventListener('click', function () {
        HISTS.forEach(function (x) { x.active = false; }); h.active = true;
        renderHist();
        $('chatTitle').textContent = h.title;
        var msgs = $('msgs');
        if (h.title === '老歌听腻，求点新鲜感') { seedThread(); }
        else {
          msgs.innerHTML = '';
          msgs.appendChild(msgEl('ai', '（演示：接入后端后，这里会通过会话历史接口加载该对话的完整消息。）'));
        }
        msgs.scrollTop = msgs.scrollHeight;
      });
      box.appendChild(d);
    });
  }

  /* ---------- 对话容器 ---------- */
  var chat = document.createElement('section');
  chat.className = 'chat';
  chat.innerHTML =
    '<div class="chat-head"><div class="chat-title" id="chatTitle">老歌听腻，求点新鲜感</div>' +
    '<div class="chat-user">已登录 · 灵_光</div></div>' +
    '<div class="msgs" id="msgs"></div>' +
    '<div class="chat-input"><div class="input-box">' +
    '<input id="chatInput" type="text" placeholder="说点什么…比如「来点适合现在心情的歌」" aria-label="输入消息">' +
    '<button type="button" class="send-btn" id="sendBtn" aria-label="发送"><span class="ic-send"></span></button>' +
    '</div></div>';

  var chatA = $('chatSlotA'), chatB = $('chatSlotB');
  function placeChat() { (state.mode === 'a' ? chatA : chatB).appendChild(chat); }

  function avatarEl(role) {
    var a = document.createElement('div');
    a.className = 'avatar ' + (role === 'ai' ? 'a-avatar' : 'u-avatar');
    a.style.width = '34px'; a.style.height = '34px'; a.style.fontSize = '11px';
    if (role === 'ai') { a.style.background = 'linear-gradient(135deg,#4A82DE,#2B4FA0)'; a.textContent = 'AI'; }
    else { a.style.background = 'linear-gradient(135deg,#E86A6A,#A63333)'; a.textContent = '灵'; }
    return a;
  }
  function msgEl(role, text, phase, pill) {
    var m = document.createElement('div');
    m.className = 'msg ' + role;
    if (phase) m.setAttribute('data-phase', phase);
    m.appendChild(avatarEl(role));
    var b = document.createElement('div');
    b.className = 'bubble'; b.textContent = text;
    if (pill) {
      var p = document.createElement('span');
      p.className = 'pill';
      p.innerHTML = '<span class="mini-play"></span><span></span>';
      p.lastChild.textContent = '正在播放《' + pill + '》';
      p.addEventListener('click', function () { setMode('b'); });
      b.appendChild(document.createElement('br'));
      b.appendChild(p);
    }
    m.appendChild(b);
    return m;
  }
  function seedThread() {
    var msgs = $('msgs'); msgs.innerHTML = '';
    msgs.appendChild(msgEl('user', '最近一直循环周杰伦的老歌，感觉有点腻了，给我点新鲜感吧？'));
    msgs.appendChild(msgEl('ai', '看了看你最近的听歌记录～你的口味集中在华语流行和东方同人上。想换换氛围的话，「雨中寂寞」歌单里的后摇和 City Pop 会很不一样，或者我按你的画像挑几首冷门但贴口味的？'));
    msgs.appendChild(msgEl('user', '雨夜想听点安静的中文歌，按我的口味挑一首直接放吧'));
    var tool = document.createElement('div');
    tool.className = 'tool-line'; tool.setAttribute('data-phase', 'b');
    tool.textContent = '🔧 正在调用 recommend_hybrid…';
    msgs.appendChild(tool);
    msgs.appendChild(msgEl('ai', '为你选了周杰伦的《晴天》——前奏的木吉他一响，雨夜的氛围就到位了。想换口味的话点右下角的列表，我还备了几首安静的备选～', 'b', '晴天'));
    var ty = document.createElement('div');
    ty.className = 'msg ai'; ty.setAttribute('data-phase', 'a');
    ty.appendChild(avatarEl('ai'));
    var tb = document.createElement('div'); tb.className = 'bubble';
    tb.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    ty.appendChild(tb);
    msgs.appendChild(ty);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function sendMsg() {
    var input = $('chatInput'); var text = input.value.trim(); if (!text) return;
    input.value = '';
    var msgs = $('msgs');
    var ty = msgs.querySelector('.typing'); if (ty) ty = ty.closest('.msg');
    if (ty) ty.remove();
    msgs.appendChild(msgEl('user', text));
    var tm = msgEl('ai', ''); tm.querySelector('.bubble').innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    msgs.appendChild(tm);
    msgs.scrollTop = msgs.scrollHeight;
    setTimeout(function () {
      tm.querySelector('.bubble').textContent = '（演示环境：接入后端 /chat/stream 后，这里会逐字流式返回真实回复。）';
      msgs.scrollTop = msgs.scrollHeight;
    }, 1100);
  }

  /* ---------- 模式切换 ---------- */
  function setMode(m) {
    state.mode = m;
    root.setAttribute('data-mode', m);
    root.querySelectorAll('.seg-btn').forEach(function (b) {
      var on = b.getAttribute('data-m') === m;
      b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    placeChat();
    var msgs = $('msgs'); msgs.scrollTop = msgs.scrollHeight;
  }
  root.querySelectorAll('.seg-btn').forEach(function (b) {
    b.addEventListener('click', function () { setMode(b.getAttribute('data-m')); });
  });

  /* ---------- 播放引擎（演示用计时器；接入后由 QMediaPlayer 驱动）---------- */
  function lineTimes(s) {
    var n = s.lines.length, arr = [], step = (s.dur - 10) / n;
    for (var i = 0; i < n; i++) arr.push(2 + i * step);
    return arr;
  }
  function renderSong() {
    var s = SONGS[state.cur];
    grad($('cover'), s); grad($('npCover'), s);
    $('coverWrap').style.boxShadow = '0 30px 70px -25px ' + s.g[0] + '77';
    $('songTitle').textContent = s.name;
    $('songArtist').textContent = s.artist + ' · ' + s.album;
    $('npName').innerHTML = '';
    $('npName').appendChild(document.createTextNode(s.name));
    var sp = document.createElement('span'); sp.textContent = s.artist; $('npName').appendChild(sp);
    var lines = $('lyrLines'); lines.innerHTML = '';
    s.lines.forEach(function (t) {
      var d = document.createElement('div'); d.className = 'lyr-line'; d.textContent = t; lines.appendChild(d);
    });
    renderDrawer();
  }
  function renderDrawer() {
    var list = $('drawerList'); list.innerHTML = '';
    $('drawerCount').textContent = SONGS.length + ' 首';
    SONGS.forEach(function (s, i) {
      var r = document.createElement('div');
      r.className = 'd-row' + (i === state.cur ? ' is-cur' : '');
      var c = document.createElement('div'); c.className = 'd-cover';
      c.style.background = 'linear-gradient(135deg,' + s.g[0] + ',' + s.g[1] + ')';
      r.appendChild(c);
      var meta = document.createElement('div'); meta.className = 'd-meta';
      if (i === state.cur) {
        var eq = document.createElement('span'); eq.className = 'eq';
        eq.innerHTML = '<i></i><i></i><i></i>'; meta.appendChild(eq);
      }
      var n = document.createElement('span'); n.className = 'd-name'; n.textContent = s.name; meta.appendChild(n);
      var a = document.createElement('span'); a.className = 'd-artist'; a.textContent = s.artist; meta.appendChild(a);
      r.appendChild(meta);
      var du = document.createElement('span'); du.className = 'd-dur'; du.textContent = fmt(s.dur); r.appendChild(du);
      r.addEventListener('click', function () { selectSong(i); });
      list.appendChild(r);
    });
  }
  function selectSong(i) {
    state.cur = i; state.t = 0; state.playing = true; updatePlayIc();
    renderSong(); tick(true);
  }
  function tick(force) {
    var s = SONGS[state.cur];
    var times = lineTimes(s);
    var idx = 0;
    for (var i = 0; i < times.length; i++) { if (state.t >= times[i]) idx = i; }
    var lines = $('lyrLines').children;
    for (var j = 0; j < lines.length; j++) lines[j].classList.toggle('is-on', j === idx);
    $('lyrLines').style.transform = 'translateY(' + (150 - idx * 40 - 20) + 'px)';
    $('pbarFill').style.width = (state.t / s.dur * 100).toFixed(2) + '%';
    $('npTime').textContent = fmt(state.t) + ' / ' + fmt(s.dur);
    if (state.t >= s.dur) { selectSong((state.cur + 1) % SONGS.length); }
  }
  setInterval(function () { if (state.playing) { state.t += 0.25; tick(); } }, 250);

  function updatePlayIc() {
    $('playIc').style.display = state.playing ? 'flex' : 'none';
    $('cover').style.animationPlayState = state.playing ? 'running' : 'paused';
    var pb = $('playBtn');
    if (!state.playing) {
      if (!pb.querySelector('.ic-play')) {
        var p = document.createElement('span'); p.className = 'ic-play'; pb.appendChild(p);
      }
    } else { var op = pb.querySelector('.ic-play'); if (op) op.remove(); }
  }
  $('playBtn').addEventListener('click', function () { state.playing = !state.playing; updatePlayIc(); });
  $('nextBtn').addEventListener('click', function () { selectSong((state.cur + 1) % SONGS.length); });
  $('prevBtn').addEventListener('click', function () { selectSong((state.cur - 1 + SONGS.length) % SONGS.length); });

  /* ---------- 抽屉 ---------- */
  function drawerOpen(v) { $('songPanel').classList.toggle('drawer-open', v); }
  $('listBtn').addEventListener('click', function () { drawerOpen(!$('songPanel').classList.contains('drawer-open')); });
  $('drawerClose').addEventListener('click', function () { drawerOpen(false); });
  $('drawerScrim').addEventListener('click', function () { drawerOpen(false); });
  $('drawerBtn').addEventListener('click', function () {
    if (state.mode !== 'b') setMode('b');
    setTimeout(function () { drawerOpen(true); }, 60);
  });

  /* ---------- 新建对话 / 设置 ---------- */
  $('newChatBtn').addEventListener('click', function () {
    HISTS.forEach(function (h) { h.active = false; });
    HISTS.unshift({ title: '新对话', time: '刚刚', active: true });
    renderHist();
    $('chatTitle').textContent = '新对话';
    var msgs = $('msgs'); msgs.innerHTML = '';
    msgs.appendChild(msgEl('ai', '你好呀，我是你的音乐伴侣～可以直接说「来点适合现在心情的歌」，或者让我看看你的听歌口味。'));
    msgs.scrollTop = msgs.scrollHeight;
  });
  $('setBtn').addEventListener('click', function (e) { e.stopPropagation(); $('setPop').classList.toggle('open'); });
  document.addEventListener('click', function (e) {
    if (!$('setPop').contains(e.target)) $('setPop').classList.remove('open');
  });
  $('qualityChips').querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () {
      $('qualityChips').querySelectorAll('.chip').forEach(function (x) { x.classList.remove('is-on'); });
      c.classList.add('is-on');
    });
  });
  $('logoutBtn').addEventListener('click', function () {
    $('chatTitle').textContent = '新对话';
    var msgs = $('msgs'); msgs.innerHTML = '';
    msgs.appendChild(msgEl('ai', '已退出登录，回到游客态。（演示：调用 POST /logout，左下角头像与昵称恢复为游客。）'));
  });
  chat.querySelector('#sendBtn').addEventListener('click', sendMsg);
  chat.querySelector('#chatInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); sendMsg(); }
  });

  /* ---------- 初始 ---------- */
  placeChat();
  renderHist();
  renderSong();
  seedThread();
  tick(true);
  updatePlayIc();
})();
</script>
</div>

</body>
</html>
